# ============================================================
# SmartGoNext Salon - Nginx Reverse Proxy Config
#
# Production domains:
#   Frontend: https://salon.smartgonext.com
#   Backend:  https://salon-backend.smartgonext.com
#
# When the backend is asleep (auto-sleep), nginx returns 502.
# The frontend auto-wake interceptor catches this, triggers a
# wake request, and retries after systemd restarts the service.
# ============================================================

# Backend upstream (single-threaded, auto-sleep)
upstream salon_backend {
    server 127.0.0.1:5000;
    keepalive 4;
}

# ============================================================
# BACKEND - salon-backend.smartgonext.com
# ============================================================
server {
    listen 80;
    server_name salon-backend.smartgonext.com;

    # Redirect HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name salon-backend.smartgonext.com;

    # SSL certificates (install with certbot)
    ssl_certificate     /etc/letsencrypt/live/salon-backend.smartgonext.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salon-backend.smartgonext.com/privkey.pem;

    client_max_body_size 100M;

    # Health endpoint (used by frontend auto-wake probe)
    location = /api/v1/health {
        proxy_pass http://salon_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All API requests
    location /api/ {
        proxy_pass http://salon_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Retry once if backend is waking up from sleep
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Static uploads
    location /api/v1/static/ {
        alias /var/www/salon/backend/app/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}

# ============================================================
# FRONTEND - salon.smartgonext.com
# ============================================================
server {
    listen 80;
    server_name salon.smartgonext.com;

    # Redirect HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name salon.smartgonext.com;

    # SSL certificates (install with certbot)
    ssl_certificate     /etc/letsencrypt/live/salon.smartgonext.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salon.smartgonext.com/privkey.pem;

    root /var/www/salon/frontend/dist;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static assets (long cache)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}